<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuSloth - Pencatatan Keuangan Harian</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font: Plus Jakarta Sans untuk kesan modern & bersih -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header / Ringkasan Saldo -->
        <header class="header-card">
            <h2>Dompet Santai 🌱</h2>
            <p class="subtitle">Kelola keuangan harian tanpa pusing</p>
            <div class="balance-box">
                <span>Total Saldo</span>
                <h1 id="total-balance">Rp 0</h1>
            </div>
        </header>

        <!-- Form Input Cepat (< 5 Detik) -->
        <section class="card form-card">
            <h3>Catat Transaksi</h3>
            <form id="transaction-form">
                <div class="input-group">
                    <input type="text" id="desc" placeholder="Keterangan (cth: Kopi & Roti)" required>
                </div>
                <div class="input-row">
                    <input type="number" id="amount" placeholder="Nominal (Rp)" required>
                    <select id="type">
                        <option value="expense">Pengeluaran</option>
                        <option value="income">Pemasukan</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Simpan Catatan</button>
            </form>
        </section>

        <!-- Riwayat Transaksi -->
        <section class="card history-card">
            <h3>Riwayat Terbaru</h3>
            <ul id="transaction-list">
                <!-- Data akan dimasukkan otomatis lewat JavaScript -->
                <li class="empty-state">Belum ada catatan hari ini. Santai dulu! 🦥</li>
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
