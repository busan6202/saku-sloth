<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saku-Sloth Financial Analytics Dashboard</title>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --header-border: #f1f5f9;
            --table-hover: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --border-color: #1f2937;
            --header-border: #1f2937;
            --table-hover: #1f2937;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 30px; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }

        .container { 
            max-width: 860px; 
            margin: auto; 
            margin-right: 310px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            transition: background 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border-color);
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--header-border); 
            padding-bottom: 20px; 
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        /* --- KARTU RINGKASAN BERGRADASI & BERCAHAYA --- */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 20px;
            border-radius: 16px;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .card-income { background: linear-gradient(135deg, #10b981, #059669); }
        .card-expense { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .card-balance { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

        .summary-card h4 {
            margin: 0 0 8px 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .summary-card .amount {
            font-size: 1.35rem;
            font-weight: 700;
        }

        /* --- GRAFIK ANALITIK --- */
        .charts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 30px; 
        }

        .chart-card { 
            background: var(--bg-color); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }

        .chart-card h3 {
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            opacity: 0.8;
        }

        /* --- TABEL RIWAYAT TRANSAKSI DENGAN PILL BADGES --- */
        .history-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: var(--table-hover);
        }

        /* Badge Kategori Berwarna Warni (Pill Style) */
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .cat-makan { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .cat-transport { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .cat-digital { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .cat-kesehatan { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .cat-belanja { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
        .cat-umum { background: rgba(100, 116, 139, 0.15); color: #64748b; }

        /* --- WIDGET SISI KANAN (JAM FLIP & EXCEL MINIMALIS) --- */
        .right-sidebar {
            position: fixed;
            right: 25px;
            top: 30px;
            width: 270px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        .widget-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .widget-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        /* Jam Flip Digital Mewah */
        .flip-clock {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .flip-card {
            background: #111827;
            color: #38bdf8;
            font-family: monospace;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
            border-bottom: 3px solid #000;
            position: relative;
        }

        .flip-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .flip-colon {
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.3rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Tombol Excel Minimalis Stylish */
        .btn-excel-minimal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 5px;
        }

        .btn-excel-minimal:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        @media(max-width: 1150px) {
            .container { margin-right: auto; }
            .right-sidebar { position: relative; right: auto; top: auto; width: 100%; margin-top: 25px; }
            .charts-grid { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- DASHBOARD UTAMA -->
    <div class="container">
        <div class="header">
            <h2>🦥 Saku-Sloth Analytics</h2>
            <div class="header-controls">
                <button class="btn-action" onclick="loadDashboard()">🔄 Refresh</button>
                <button class="btn-action" id="themeToggleBtn" onclick="toggleTheme()">🌙 Gelap</button>
            </div>
        </div>

        <!-- Kartu Ringkasan Bergradasi Stylish -->
        <div class="summary-grid">
            <div class="summary-card card-income">
                <h4>Total Pemasukan</h4>
                <div class="amount" id="sumIncome">Rp 0</div>
            </div>
            <div class="summary-card card-expense">
                <h4>Total Pengeluaran</h4>
                <div class="amount" id="sumExpense">Rp 0</div>
            </div>
            <div class="summary-card card-balance">
                <h4>Saldo Berjalan</h4>
                <div class="amount" id="sumBalance">Rp 0</div>
            </div>
        </div>

        <!-- Grafik -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Pemasukan vs Pengeluaran</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Kategori Pengeluaran</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <!-- Tabel Riwayat -->
        <div class="history-section">
            <h3>Riwayat Transaksi Keuangan</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Kategori</th>
                            <th>Tipe</th>
                            <th>Nominal</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                        <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- WIDGET SISI KANAN -->
    <div class="right-sidebar">
        <!-- Kotak Jam Flip -->
        <div class="widget-box">
            <div class="widget-title">Waktu Server</div>
            <div class="flip-clock">
                <div class="flip-card" id="hours">00</div>
                <div class="flip-colon">:</div>
                <div class="flip-card" id="minutes">00</div>
                <div class="flip-colon">:</div>
                <div class="flip-card" id="seconds">00</div>
            </div>
        </div>

        <!-- Tombol Download Excel -->
        <a href="https://saku-sloth.vercel.app/api/export-excel" class="btn-excel-minimal">
            <span>📥</span> Export Laporan Excel
        </a>
    </div>

    <script>
        const API_BASE_URL = 'https://saku-sloth.vercel.app';

        let barChartInstance = null;
        let pieChartInstance = null;

        function getCategoryClass(category) {
            const cat = category.toLowerCase();
            if (cat.includes('makan') || cat.includes('minum')) return 'cat-makan';
            if (cat.includes('transport')) return 'cat-transport';
            if (cat.includes('digital') || cat.includes('langganan')) return 'cat-digital';
            if (cat.includes('sehat') || cat.includes('kesehatan')) return 'cat-kesehatan';
            if (cat.includes('belanja') || cat.includes('lifestyle')) return 'cat-belanja';
            return 'cat-umum';
        }

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/transactions`);
                if (!res.ok) throw new Error("Gagal mengambil data");
                const data = await res.json();

                let totalIncome = 0;
                let totalExpense = 0;
                let categoryMap = {};
                const tableBody = document.getElementById('transactionTableBody');
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Belum ada catatan transaksi.</td></tr>';
                }

                data.forEach(trx => {
                    const amt = Number(trx.amount);
                    if (trx.type === 'income') {
                        totalIncome += amt;
                    } else {
                        totalExpense += amt;
                        categoryMap[trx.category] = (categoryMap[trx.category] || 0) + amt;
                    }

                    const row = document.createElement('tr');
                    const formattedDate = new Date(trx.date).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                    const sign = trx.type === 'income' ? '+' : '-';
                    const colorClass = trx.type === 'income' ? 'text-income' : 'text-expense';
                    const typeLabel = trx.type === 'income' ? 'Pemasukan' : 'Pengeluaran';
                    const badgeClass = getCategoryClass(trx.category);

                    row.innerHTML = `
                        <td>${formattedDate}</td>
                        <td><strong>${trx.desc}</strong></td>
                        <td><span class="category-badge ${badgeClass}">${trx.category}</span></td>
                        <td><span style="font-weight:600; color:${trx.type === 'income' ? '#10b981' : '#ef4444'}">${typeLabel}</span></td>
                        <td style="font-weight:700; color:${trx.type === 'income' ? '#10b981' : '#ef4444'}">${sign} Rp ${amt.toLocaleString('id-ID')}</td>
                    `;
                    tableBody.appendChild(row);
                });

                const balance = totalIncome - totalExpense;
                document.getElementById('sumIncome').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
                document.getElementById('sumExpense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
                document.getElementById('sumBalance').innerText = `Rp ${balance.toLocaleString('id-ID')}`;

                if (barChartInstance) barChartInstance.destroy();
                if (pieChartInstance) pieChartInstance.destroy();

                barChartInstance = new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Pemasukan', 'Pengeluaran'],
                        datasets: [{
                            data: [totalIncome, totalExpense],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });

                pieChartInstance = new Chart(document.getElementById('pieChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(categoryMap),
                        datasets: [{
                            data: Object.values(categoryMap),
                            backgroundColor: ['#3b82f6', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899', '#64748b'],
                            borderWidth: 2
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
                });

            } catch (err) {
                console.error("Gagal memuat data:", err);
                document.getElementById('transactionTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ef4444;">Gagal memuat data dari server.</td></tr>';
            }
        }

        // Jam Flip Mekanik Realtime
        function updateFlipClock() {
            const now = new Date();
            document.getElementById('hours').innerText = String(now.getHours()).padStart(2, '0');
            document.getElementById('minutes').innerText = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('seconds').innerText = String(now.getSeconds()).padStart(2, '0');
        }
        setInterval(updateFlipClock, 1000);
        updateFlipClock();

        // Toggle Tema Terang/Gelap
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 Gelap';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Terang';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerText = '☀️ Terang';
        }

        loadDashboard();
    </script>
</body>
</html>
