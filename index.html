<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saku-Sloth Financial Analytics Dashboard</title>
    <!-- Chart.js untuk Grafik Bar & Pie -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #eeeeee;
            --header-border: #eeeeee;
            --card-card-bg: #fafafa;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --header-border: #333333;
            --card-card-bg: #252525;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }

        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: background 0.3s;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--header-border); 
            padding-bottom: 15px; 
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-theme {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-theme:hover {
            background: var(--text-color);
            color: var(--card-bg);
        }

        .charts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-top: 30px; 
        }

        .chart-card { 
            background: var(--card-card-bg); 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
        }

        /* --- WIDGET MELAYANG KANAN (FLOATING DOCK) --- */
        .floating-dock {
            position: fixed;
            right: 25px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            z-index: 9999;
        }

        /* Jam Flip Mini Estetik */
        .flip-clock {
            background: #1a1a1a;
            color: #00ffcc;
            padding: 10px 16px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #333;
            letter-spacing: 2px;
        }

        /* Tombol Melayang Download Excel yang Menarik */
        .btn-floating-excel {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            padding: 14px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse-glow 2s infinite;
        }

        .btn-floating-excel:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.6);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        @media(max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🦥 Saku-Sloth Financial Analytics</h2>
            <div class="header-controls">
                <!-- Opsi Terang / Gelap -->
                <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()">🌙 Gelap</button>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📊 Perbandingan Pemasukan vs Pengeluaran</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🥧 Distribusi Kategori Pengeluaran</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <!-- WIDGET MELAYANG SEBELAH KANAN -->
    <div class="floating-dock">
        <!-- Jam Flip Digital -->
        <div class="flip-clock" id="flipClock">00:00:00</div>
        
        <!-- Tombol Download Excel Melayang -->
        <a href="/api/export-excel" class="btn-floating-excel" title="Download Laporan Excel">
            <span>📥</span> Download Excel
        </a>
    </div>

    <script>
        // --- 1. Logika Grafik Analytics ---
        async function loadAnalytics() {
            try {
                const res = await fetch('/api/transactions');
                const data = await res.json();

                let totalIncome = 0;
                let totalExpense = 0;
                let categoryMap = {};

                data.forEach(trx => {
                    const amt = Number(trx.amount);
                    if (trx.type === 'income') {
                        totalIncome += amt;
                    } else {
                        totalExpense += amt;
                        categoryMap[trx.category] = (categoryMap[trx.category] || 0) + amt;
                    }
                });

                // Render Bar Chart
                new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Pemasukan', 'Pengeluaran'],
                        datasets: [{
                            label: 'Jumlah (Rp)',
                            data: [totalIncome, totalExpense],
                            backgroundColor: ['#28a745', '#dc3545']
                        }]
                    }
                });

                // Render Pie Chart
                new Chart(document.getElementById('pieChart'), {
                    type: 'pie',
                    data: {
                        labels: Object.keys(categoryMap),
                        datasets: [{
                            data: Object.values(categoryMap),
                            backgroundColor: ['#007bff', '#ffc107', '#17a2b8', '#6c757d', '#e83e8c', '#fd7e14']
                        }]
                    }
                });

            } catch (err) {
                console.error("Gagal memuat analitik:", err);
            }
        }

        // --- 2. Logika Jam Flip Realtime ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('flipClock').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. Logika Opsi Terang / Gelap (Theme Switcher) ---
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 Gelap';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Terang';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Cek preferensi tema sebelumnya
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerText = '☀️ Terang';
        }

        loadAnalytics();
    </script>
</body>
</html>
