<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saku-Sloth Financial Analytics Dashboard</title>
    <!-- Chart.js untuk Grafik Bar & Pie -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #eeeeee;
            --header-border: #eeeeee;
            --card-card-bg: #fafafa;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --header-border: #333333;
            --card-card-bg: #252525;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }

        /* Container utama diberi margin-right agar tidak tertutup panel samping */
        .container { 
            max-width: 820px; 
            margin: auto; 
            margin-right: 310px; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: background 0.3s;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--header-border); 
            padding-bottom: 15px; 
        }

        .header h2 {
            margin: 0;
            font-size: 1.4rem;
        }

        .btn-theme {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-theme:hover {
            background: var(--text-color);
            color: var(--card-bg);
        }

        .charts-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            margin-top: 25px; 
        }

        .chart-card { 
            background: var(--card-card-bg); 
            padding: 20px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
        }

        .chart-card h3 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }

        /* --- PANEL SISI KANAN MELAYANG (WIDGET DOCK) --- */
        .right-sidebar {
            position: fixed;
            right: 25px;
            top: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        .sidebar-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .sidebar-title {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #888;
        }

        /* --- EFEK JAM FLIP DIGITAL KLASIK --- */
        .flip-clock-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: center;
        }

        .flip-unit {
            background: linear-gradient(to bottom, #2c2c2c 0%, #1a1a1a 100%);
            color: #00ffcc;
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.4);
            border-bottom: 3px solid #000;
            position: relative;
        }
        
        /* Garis tengah ala lembaran flip */
        .flip-unit::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.8);
        }

        .flip-separator {
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.3rem;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* --- TOMBOL EXCEL MEMANJANG KE BAWAH --- */
        .btn-excel-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #107c41, #185c37);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(16, 124, 65, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .btn-excel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 124, 65, 0.5);
        }

        .excel-icon {
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        .excel-label {
            font-weight: bold;
            font-size: 1rem;
        }

        .excel-desc {
            font-size: 0.75rem;
            opacity: 0.85;
            margin-top: 3px;
        }

        @media(max-width: 1150px) {
            .container { margin-right: auto; }
            .right-sidebar { position: relative; right: auto; top: auto; width: 100%; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <!-- KONTEN UTAMA DASHBOARD -->
    <div class="container">
        <div class="header">
            <h2>🦥 Saku-Sloth Financial Analytics</h2>
            <div class="header-controls">
                <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()">🌙 Gelap</button>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📊 Perbandingan Pemasukan vs Pengeluaran</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🥧 Distribusi Kategori Pengeluaran</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <!-- PANEL MELAYANG DI SEBELAH KANAN -->
    <div class="right-sidebar">
        <!-- Jam Flip Digital Klasik -->
        <div class="sidebar-card">
            <div class="sidebar-title">Waktu Server</div>
            <div class="flip-clock-container">
                <div class="flip-unit" id="flipHours">00</div>
                <div class="flip-separator">:</div>
                <div class="flip-unit" id="flipMinutes">00</div>
                <div class="flip-separator">:</div>
                <div class="flip-unit" id="flipSeconds">00</div>
            </div>
        </div>

        <!-- Tombol Download Excel Memanjang ke Bawah -->
        <a href="/api/export-excel" class="btn-excel-card">
            <div class="excel-icon">📊</div>
            <div class="excel-label">Download Laporan Excel</div>
            <div class="excel-desc">Ekspor data finansial (.CSV)</div>
        </a>
    </div>

    <script>
        async function loadAnalytics() {
            try {
                const res = await fetch('/api/transactions');
                const data = await res.json();

                let totalIncome = 0;
                let totalExpense = 0;
                let categoryMap = {};

                data.forEach(trx => {
                    const amt = Number(trx.amount);
                    if (trx.type === 'income') {
                        totalIncome += amt;
                    } else {
                        totalExpense += amt;
                        categoryMap[trx.category] = (categoryMap[trx.category] || 0) + amt;
                    }
                });

                new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Pemasukan', 'Pengeluaran'],
                        datasets: [{
                            label: 'Jumlah (Rp)',
                            data: [totalIncome, totalExpense],
                            backgroundColor: ['#28a745', '#dc3545']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: true }
                });

                new Chart(document.getElementById('pieChart'), {
                    type: 'pie',
                    data: {
                        labels: Object.keys(categoryMap),
                        datasets: [{
                            data: Object.values(categoryMap),
                            backgroundColor: ['#007bff', '#ffc107', '#17a2b8', '#6c757d', '#e83e8c', '#fd7e14']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: true }
                });

            } catch (err) {
                console.error("Gagal memuat analitik:", err);
            }
        }

        function updateFlipClock() {
            const now = new Date();
            document.getElementById('flipHours').innerText = String(now.getHours()).padStart(2, '0');
            document.getElementById('flipMinutes').innerText = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('flipSeconds').innerText = String(now.getSeconds()).padStart(2, '0');
        }
        setInterval(updateFlipClock, 1000);
        updateFlipClock();

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 Gelap';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Terang';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerText = '☀️ Terang';
        }

        loadAnalytics();
    </script>
</body>
</html>
