<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saku-Sloth Financial Analytics Dashboard</title>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --header-border: #f1f5f9;
            --table-hover: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --border-color: #1f2937;
            --header-border: #1f2937;
            --table-hover: #1f2937;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 30px; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }

        /* Container utama diberi jarak kanan untuk sidebar vertikal */
        .container { 
            max-width: 900px; 
            margin: auto; 
            margin-right: 110px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            transition: background 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border-color);
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--header-border); 
            padding-bottom: 20px; 
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        /* --- KARTU RINGKASAN BERGRADASI --- */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 20px;
            border-radius: 16px;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card-income { background: linear-gradient(135deg, #10b981, #059669); }
        .card-expense { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .card-balance { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

        .summary-card h4 {
            margin: 0 0 8px 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .summary-card .amount {
            font-size: 1.35rem;
            font-weight: 700;
        }

        /* --- GRAFIK ANALITIK --- */
        .charts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 30px; 
        }

        .chart-card { 
            background: var(--bg-color); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
        }

        .chart-card h3 {
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            opacity: 0.8;
        }

        /* --- TABEL RIWAYAT TRANSAKSI --- */
        .history-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: var(--table-hover);
        }

        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .cat-makan { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .cat-transport { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .cat-digital { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .cat-kesehatan { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .cat-belanja { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
        .cat-umum { background: rgba(100, 116, 139, 0.15); color: #64748b; }

        /* --- SIDEBAR VERTIKAL KANAN (ALA PROYEK ANDA) --- */
        .vertical-sidebar {
            position: fixed;
            right: 20px;
            top: 25px;
            width: 75px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            gap: 16px;
            z-index: 9999;
        }

        /* Status Online */
        .status-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: #10b981;
            gap: 3px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            width: 100%;
        }

        /* Blok Jam Vertikal (Jam, Menit, Detik) */
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
            width: 100%;
        }

        .time-val {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: monospace;
            color: var(--text-color);
        }

        .time-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Tombol Aksi di Sidebar (Download Excel & Tema) */
        .sidebar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .sidebar-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .sidebar-btn.excel-btn {
            background: #10b981;
            color: white;
            border: none;
        }
        .sidebar-btn.excel-btn:hover {
            background: #059669;
        }

        @media(max-width: 1100px) {
            .container { margin-right: auto; }
            .vertical-sidebar { display: none; } /* Sembunyikan di layar HP kecil */
            .charts-grid { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- DASHBOARD UTAMA -->
    <div class="container">
        <div class="header">
            <h2>🦥 Saku-Sloth Analytics</h2>
            <div class="header-controls">
                <button class="btn-action" onclick="loadDashboard()">🔄 Refresh</button>
                <button class="btn-action" id="themeToggleBtn" onclick="toggleTheme()">🌙 Tema</button>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-card card-income">
                <h4>Total Pemasukan</h4>
                <div class="amount" id="sumIncome">Rp 0</div>
            </div>
            <div class="summary-card card-expense">
                <h4>Total Pengeluaran</h4>
                <div class="amount" id="sumExpense">Rp 0</div>
            </div>
            <div class="summary-card card-balance">
                <h4>Saldo Berjalan</h4>
                <div class="amount" id="sumBalance">Rp 0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Pemasukan vs Pengeluaran</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Kategori Pengeluaran</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <div class="history-section">
            <h3>Riwayat Transaksi Keuangan</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Kategori</th>
                            <th>Tipe</th>
                            <th>Nominal</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                        <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SIDEBAR VERTIKAL KANAN (ALA PROYEK ANDA) -->
    <div class="vertical-sidebar">
        <!-- Status Online -->
        <div class="status-box">
            <span>🟢</span>
            <span>ONLINE</span>
        </div>

        <!-- Waktu Vertikal: Jam -->
        <div class="time-block">
            <span class="time-val" id="vHours">00</span>
            <span class="time-label">JAM</span>
        </div>

        <!-- Waktu Vertikal: Menit -->
        <div class="time-block">
            <span class="time-val" id="vMinutes">00</span>
            <span class="time-label">MNT</span>
        </div>

        <!-- Waktu Vertikal: Detik -->
        <div class="time-block">
            <span class="time-val" id="vSeconds">00</span>
            <span class="time-label">DTK</span>
        </div>

        <!-- Tombol Download Excel Disatukan -->
        <a href="https://saku-sloth.vercel.app/api/export-excel" class="sidebar-btn excel-btn" title="Export Laporan Excel (.CSV)">
            📊
        </a>
    </div>

    <script>
        const API_BASE_URL = 'https://saku-sloth.vercel.app';

        let barChartInstance = null;
        let pieChartInstance = null;

        function getCategoryClass(category) {
            const cat = category.toLowerCase();
            if (cat.includes('makan') || cat.includes('minum')) return 'cat-makan';
            if (cat.includes('transport')) return 'cat-transport';
            if (cat.includes('digital') || cat.includes('langganan')) return 'cat-digital';
            if (cat.includes('sehat') || cat.includes('kesehatan')) return 'cat-kesehatan';
            if (cat.includes('belanja') || cat.includes('lifestyle')) return 'cat-belanja';
            return 'cat-umum';
        }

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/transactions`);
                if (!res.ok) throw new Error("Gagal mengambil data");
                const data = await res.json();

                let totalIncome = 0;
                let totalExpense = 0;
                let categoryMap = {};
                const tableBody = document.getElementById('transactionTableBody');
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Belum ada catatan transaksi.</td></tr>';
                }

                data.forEach(trx => {
                    const amt = Number(trx.amount);
                    if (trx.type === 'income') {
                        totalIncome += amt;
                    } else {
                        totalExpense += amt;
                        categoryMap[trx.category] = (categoryMap[trx.category] || 0) + amt;
                    }

                    const row = document.createElement('tr');
                    const formattedDate = new Date(trx.date).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                    const sign = trx.type === 'income' ? '+' : '-';
                    const typeLabel = trx.type === 'income' ? 'Pemasukan' : 'Pengeluaran';
                    const badgeClass = getCategoryClass(trx.category);

                    row.innerHTML = `
                        <td>${formattedDate}</td>
                        <td><strong>${trx.desc}</strong></td>
                        <td><span class="category-badge ${badgeClass}">${trx.category}</span></td>
                        <td><span style="font-weight:600; color:${trx.type === 'income' ? '#10b981' : '#ef4444'}">${typeLabel}</span></td>
                        <td style="font-weight:700; color:${trx.type === 'income' ? '#10b981' : '#ef4444'}">${sign} Rp ${amt.toLocaleString('id-ID')}</td>
                    `;
                    tableBody.appendChild(row);
                });

                const balance = totalIncome - totalExpense;
                document.getElementById('sumIncome').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
                document.getElementById('sumExpense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
                document.getElementById('sumBalance').innerText = `Rp ${balance.toLocaleString('id-ID')}`;

                if (barChartInstance) barChartInstance.destroy();
                if (pieChartInstance) pieChartInstance.destroy();

                barChartInstance = new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Pemasukan', 'Pengeluaran'],
                        datasets: [{
                            data: [totalIncome, totalExpense],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });

                pieChartInstance = new Chart(document.getElementById('pieChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(categoryMap),
                        datasets: [{
                            data: Object.values(categoryMap),
                            backgroundColor: ['#3b82f6', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899', '#64748b'],
                            borderWidth: 2
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
                });

            } catch (err) {
                console.error("Gagal memuat data:", err);
                document.getElementById('transactionTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ef4444;">Gagal memuat data dari server.</td></tr>';
            }
        }

        // Jam Vertikal Realtime
        function updateVerticalClock() {
            const now = new Date();
            document.getElementById('vHours').innerText = String(now.getHours()).padStart(2, '0');
            document.getElementById('vMinutes').innerText = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('vSeconds').innerText = String(now.getSeconds()).padStart(2, '0');
        }
        setInterval(updateVerticalClock, 1000);
        updateVerticalClock();

        // Toggle Tema Terang/Gelap
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 Tema';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Tema';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerText = '☀️ Tema';
        }

        loadDashboard();
    </script>
</body>
</html>
