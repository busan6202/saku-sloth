<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saku-Sloth Financial Analytics Dashboard</title>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #e9ecef;
            --header-border: #f1f3f5;
            --card-card-bg: #ffffff;
            --table-hover: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --border-color: #334155;
            --header-border: #334155;
            --card-card-bg: #1e293b;
            --table-hover: #162032;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 25px; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }

        .container { 
            max-width: 840px; 
            margin: auto; 
            margin-right: 290px; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            transition: background 0.3s;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--header-border); 
            padding-bottom: 15px; 
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-theme, .btn-refresh {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-theme:hover, .btn-refresh:hover {
            background: var(--border-color);
        }

        /* Ringkasan Saldo */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--card-card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card h4 {
            margin: 0 0 6px 0;
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-card .amount {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .text-income { color: #10b981; }
        .text-expense { color: #ef4444; }
        .text-balance { color: #3b82f6; }

        /* Grafik */
        .charts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 30px; 
        }

        .chart-card { 
            background: var(--card-card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
        }

        .chart-card h3 {
            font-size: 0.85rem;
            margin-top: 0;
            margin-bottom: 12px;
            text-align: center;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Tabel Riwayat */
        .history-section h3 {
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        tr:hover {
            background: var(--table-hover);
        }

        /* --- WIDGET KANAN GABUNGAN (MINIMALIS & ELEGAN MEMANJANG KE BAWAH) --- */
        .right-sidebar {
            position: fixed;
            right: 25px;
            top: 25px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        .widget-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .widget-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        /* --- EFEK JAM FLIP MEKANIK (CSS FLIP) --- */
        .flip-clock {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        .flip-card {
            background: #111827;
            color: #38bdf8;
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 8px 10px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            border-bottom: 2px solid #000;
        }

        .flip-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .flip-colon {
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.2rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* --- TOMBOL EXCEL MINIMALIS (MENYATU DI BAWAH) --- */
        .btn-excel-minimal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            box-sizing: border-box;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .btn-excel-minimal:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        @media(max-width: 1100px) {
            .container { margin-right: auto; }
            .right-sidebar { position: relative; right: auto; top: auto; width: 100%; margin-top: 20px; }
            .charts-grid { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- DASHBOARD UTAMA -->
    <div class="container">
        <div class="header">
            <h2>🦥 Saku-Sloth Analytics</h2>
            <div class="header-controls">
                <button class="btn-refresh" onclick="loadDashboard()">🔄 Refresh</button>
                <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()">🌙 Gelap</button>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-card">
                <h4>Total Pemasukan</h4>
                <div class="amount text-income" id="sumIncome">Rp 0</div>
            </div>
            <div class="summary-card">
                <h4>Total Pengeluaran</h4>
                <div class="amount text-expense" id="sumExpense">Rp 0</div>
            </div>
            <div class="summary-card">
                <h4>Saldo Berjalan</h4>
                <div class="amount text-balance" id="sumBalance">Rp 0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Pemasukan vs Pengeluaran</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Kategori Pengeluaran</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <div class="history-section">
            <h3>Riwayat Transaksi Keuangan</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Kategori</th>
                            <th>Tipe</th>
                            <th>Nominal</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                        <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- WIDGET SISI KANAN (JAM FLIP & EXCEL MINIMALIS) -->
    <div class="right-sidebar">
        <!-- Kotak Jam Flip Minimalis -->
        <div class="widget-box">
            <div class="widget-title">Waktu Server</div>
            <div class="flip-clock">
                <div class="flip-card" id="hours">00</div>
                <div class="flip-colon">:</div>
                <div class="flip-card" id="minutes">00</div>
                <div class="flip-colon">:</div>
                <div class="flip-card" id="seconds">00</div>
            </div>
        </div>

        <!-- Tombol Download Excel Minimalis -->
        <a href="https://saku-sloth.vercel.app/api/export-excel" class="btn-excel-minimal">
            <span>📥</span> Export Laporan Excel
        </a>
    </div>

    <script>
        const API_BASE_URL = 'https://saku-sloth.vercel.app';

        let barChartInstance = null;
        let pieChartInstance = null;

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/transactions`);
                if (!res.ok) throw new Error("Gagal mengambil data");
                const data = await res.json();

                let totalIncome = 0;
                let totalExpense = 0;
                let categoryMap = {};
                const tableBody = document.getElementById('transactionTableBody');
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Belum ada catatan transaksi.</td></tr>';
                }

                data.forEach(trx => {
                    const amt = Number(trx.amount);
                    if (trx.type === 'income') {
                        totalIncome += amt;
                    } else {
                        totalExpense += amt;
                        categoryMap[trx.category] = (categoryMap[trx.category] || 0) + amt;
                    }

                    const row = document.createElement('tr');
                    const formattedDate = new Date(trx.date).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                    const sign = trx.type === 'income' ? '+' : '-';
                    const colorClass = trx.type === 'income' ? 'text-income' : 'text-expense';
                    const typeLabel = trx.type === 'income' ? 'Pemasukan' : 'Pengeluaran';

                    row.innerHTML = `
                        <td>${formattedDate}</td>
                        <td><strong>${trx.desc}</strong></td>
                        <td>${trx.category}</td>
                        <td><span class="${colorClass}">${typeLabel}</span></td>
                        <td class="${colorClass}"><strong>${sign} Rp ${amt.toLocaleString('id-ID')}</strong></td>
                    `;
                    tableBody.appendChild(row);
                });

                const balance = totalIncome - totalExpense;
                document.getElementById('sumIncome').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
                document.getElementById('sumExpense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
                document.getElementById('sumBalance').innerText = `Rp ${balance.toLocaleString('id-ID')}`;

                if (barChartInstance) barChartInstance.destroy();
                if (pieChartInstance) pieChartInstance.destroy();

                barChartInstance = new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Pemasukan', 'Pengeluaran'],
                        datasets: [{
                            data: [totalIncome, totalExpense],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderRadius: 6
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });

                pieChartInstance = new Chart(document.getElementById('pieChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(categoryMap),
                        datasets: [{
                            data: Object.values(categoryMap),
                            backgroundColor: ['#3b82f6', '#f59e0b', '#06b6d4', '#8b5cf6', '#ec4899', '#64748b']
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }
                });

            } catch (err) {
                console.error("Gagal memuat data:", err);
                document.getElementById('transactionTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ef4444;">Gagal memuat data dari server.</td></tr>';
            }
        }

        // Jam Flip Mekanik Realtime
        function updateFlipClock() {
            const now = new Date();
            document.getElementById('hours').innerText = String(now.getHours()).padStart(2, '0');
            document.getElementById('minutes').innerText = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('seconds').innerText = String(now.getSeconds()).padStart(2, '0');
        }
        setInterval(updateFlipClock, 1000);
        updateFlipClock();

        // Toggle Tema Terang/Gelap
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.innerText = '🌙 Gelap';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ Terang';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggleBtn').innerText = '☀️ Terang';
        }

        loadDashboard();
    </script>
</body>
</html>
